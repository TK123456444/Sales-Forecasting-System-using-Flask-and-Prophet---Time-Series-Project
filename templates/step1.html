<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Time Series Forecasting</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

background:url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1400&q=80");

background-size:cover;

background-repeat:no-repeat;

background-attachment:fixed;

font-family:Arial,Helvetica,sans-serif;

}

.overlay{

background:rgba(0,0,0,.55);

min-height:100vh;

padding:40px;

}

.card{

background:rgba(255,255,255,.95);

border-radius:10px;

padding:25px;

}

h2{

font-weight:bold;

}

label{

font-weight:600;

margin-top:10px;

}

.table{

background:white;

}

#loading{

display:none;

text-align:center;

margin-top:20px;

}

img{

max-width:100%;

border-radius:8px;

}

</style>

</head>

<body>

<div class="overlay">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card">

<h2 class="text-center mb-4">

UPLOAD YOUR FILE

</h2>

<p class="text-center">

Format should be CSV

</p>

{% if error %}

<div class="alert alert-danger">

{{ error }}

</div>

{% endif %}

<form method="POST"

enctype="multipart/form-data"

onsubmit="showLoading()">

<div class="mb-3">

<input

type="file"

class="form-control"

name="userfile"

accept=".csv"

required>

</div>

<div class="mb-3">

<label>

Date Column Name

</label>

<input

type="text"

class="form-control"

name="query1"

placeholder="Example : Date"

required>

</div>

<div class="mb-3">

<label>

Feature / Variable to Forecast

</label>

<input

type="text"

class="form-control"

name="query2"

placeholder="Example : Sales"

required>

</div>

<div class="mb-3">

<label>

Forecasting

</label>

<select

class="form-select"

name="query4">

<option value="D">

Daily

</option>

<option value="W">

Weekly

</option>

<option value="M" selected>

Monthly

</option>

<option value="Y">

Yearly

</option>

</select>

</div>

<div class="mb-3">

<label>

How many intervals do you want to forecast?

</label>

<input

type="number"

class="form-control"

name="query3"

min="1"

placeholder="30"

required>

</div>

<button

class="btn btn-primary"

type="submit">

SUBMIT

</button>

</form>

<div id="loading">

<div class="spinner-border text-primary mt-4"></div>

<p>

Forecasting...

Please wait...

</p>

</div>

{% if user_image %}

<hr>

<h2>

Forecast Graph

</h2>

<img

src="{{ user_image }}"

class="img-fluid">

{% endif %}

{% if tables %}

<hr>

<h2>

Forecasted Data

</h2>

{% for table in tables %}

{{ table|safe }}

{% endfor %}

{% endif %}

</div>

</div>

</div>

</div>

</div>

<script>

function showLoading(){

document.getElementById("loading").style.display="block";

}

</script>

</body>

</html>
